services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:${FRONTEND_PORT:-7006}
      # auto-registers the mounted volume below as an index root on startup - see
      # DefaultIndexRootInitializer
      - APP_INDEXING_DEFAULT_ROOT=/data
      # Optional: enables the "generate tags with AI" feature. Unset -> that endpoint returns 503.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      # writable (not :ro): the in-app upload feature saves files directly into a tracked root
      - ${INDEX_ROOT:-./sample-data}:/data
    ports:
      - "${BACKEND_PORT:-7007}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-7006}:80"

  # Reverse-proxy gateway: single entry point to run the whole app under one
  # address/domain (APP_DOMAIN) instead of hitting frontend/backend ports
  # directly. Forwards everything to `frontend`, which already proxies
  # /api, /actuator, /swagger-ui and /v3/api-docs to backend internally.
  nginx:
    build: ./nginx
    depends_on:
      - frontend
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
    ports:
      - "${NGINX_PORT:-80}:80"

volumes:
  es-data:
