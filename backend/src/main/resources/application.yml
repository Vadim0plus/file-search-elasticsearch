spring:
  application:
    name: backend
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

server:
  port: 8080

app:
  indexing:
    max-file-size-mb: 50
    batch-size: 200
    watch-debounce-ms: 500
    excluded-dirs:
      - .git
      - node_modules
      - target
      - build
      - dist
      - .idea
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fileindex: INFO
