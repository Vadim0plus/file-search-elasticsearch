spring:
  application:
    name: backend
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080
  # Trust X-Forwarded-* headers from the nginx frontend proxy - without this, springdoc infers
  # the OpenAPI "servers" base URL from the request as Tomcat sees it (the backend container's
  # own address), so Swagger UI's "Try it out" would call an address unreachable from outside
  # the Docker network instead of the URL the browser actually used.
  forward-headers-strategy: framework

app:
  indexing:
    max-file-size-mb: 50
    batch-size: 200
    watch-debounce-ms: 500
    excluded-dirs:
      - .git
      - node_modules
      - target
      - build
      - dist
      - .idea
    # Auto-registered as an index root on startup if it exists, so a fresh checkout has
    # browsable results without a manual "add root" step. Blank disables this (e.g. bare
    # `./gradlew bootRun` outside Docker, where /data isn't mounted).
    default-root: ${APP_INDEXING_DEFAULT_ROOT:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    username: ${APP_AUTH_USERNAME:admin}
    password: ${APP_AUTH_PASSWORD:admin}
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${APP_AI_MODEL:claude-opus-5}
    max-content-chars: 8000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fileindex: INFO
