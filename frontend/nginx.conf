server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uncompressed JS/CSS bundles are large enough that they time out or get cut
    # short on slow/unstable upstream links (seen in practice: the ~200KB main JS
    # chunk would repeatedly stall mid-transfer on a bandwidth-constrained host).
    # gzip_static serves the .gz files baked in at build time with a normal fixed
    # Content-Length; plain `gzip on` falls back to on-the-fly compression (which
    # requires chunked encoding - some networks mishandle that) for anything not
    # pre-compressed.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Host/X-Forwarded-* headers here matter: springdoc derives the "servers" base URL in the
    # generated spec from them, so without these Swagger UI's "Try it out" would call the
    # backend container's internal Docker hostname instead of the URL the browser can reach.
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
